# AI 工具箱站点配置
# 放置位置：/etc/nginx/conf.d/ai-toolbox.conf
# 前端静态目录：/var/www/ai-toolbox（frontend/out 构建产物）
# 修改后验证并重载：nginx -t && systemctl reload nginx

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name horseforever.cn www.horseforever.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name horseforever.cn www.horseforever.cn;

    # SSL 证书按 certbot 实际生成路径填写
    ssl_certificate     /etc/letsencrypt/live/horseforever.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horseforever.cn/privkey.pem;

    # 前端静态文件（Next.js 静态导出产物）
    root /var/www/ai-toolbox;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 带内容哈希的静态资源长缓存；html 不缓存，保证更新即时生效
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /_next/static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到 FastAPI（systemd 守护的 uvicorn）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # 摘要/解读/手动早报耗时较长，读超时放宽
        client_max_body_size 1m;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
